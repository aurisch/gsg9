<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>GSG 9 – Spezialretter</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#10243a;color:white}header{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#071626}h1{font-size:clamp(20px,4vw,32px);margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffdd5a}.small{background:#28445d;color:white;border:1px solid #607a90;border-radius:14px;padding:12px}.wrap{max-width:1100px;margin:auto;padding:18px}.status{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.pill{background:#24415b;padding:10px 16px;border-radius:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.mission{border:3px solid #456c86;background:#19334b;border-radius:24px;color:white;padding:16px;min-height:145px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;font-size:20px;font-weight:750;text-align:center}.mission .emoji{font-size:60px}.mission:active,.choice:active{transform:scale(.97)}.stage{background:linear-gradient(155deg,#2d607c,#174058);border-radius:24px;padding:20px;text-align:center;min-height:310px}.scene{font-size:clamp(65px,15vw,135px);padding:14px}.instruction{font-size:clamp(22px,4vw,34px);font-weight:750;line-height:1.25;max-width:740px;margin:14px auto}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}.choice{min-height:120px;border:3px solid #8cbbd1;background:#fff;color:#12263b;border-radius:22px;font-size:clamp(44px,8vw,72px);display:flex;align-items:center;justify-content:center}.choice.good{background:#b2f3ba}.back{background:#ffcf59;color:#182638;border:0;border-radius:18px;padding:14px 20px;font-weight:800;font-size:20px}.message{font-size:24px;min-height:40px;margin:18px 0}.stars{font-size:28px;color:#ffd85b}.hidden{display:none}.foot{font-size:13px;color:#bed0df;margin:24px 0} @media(max-width:450px){.choices{gap:7px}.choice{min-height:95px}.mission{min-height:130px}}
.forest{position:relative;min-height:390px;overflow:hidden;border-radius:22px;background:linear-gradient(#83c9ec 0 38%,#76b46c 38% 100%);touch-action:pan-y}.forest .tree{position:absolute;font-size:65px;pointer-events:none;transform:translate(-50%,-100%);z-index:0}.forest .bush{z-index:1}.bush{position:absolute;border:0;background:transparent;font-size:clamp(53px,10vw,85px);padding:10px;min-width:80px;min-height:80px;transform:translate(-50%,-50%);transition:transform .25s}.bush:active{transform:translate(-50%,-50%) scale(.88)}.bush.found{font-size:56px}.forestbar{font-size:24px;font-weight:800;margin:12px}.foresthint{font-size:19px;margin:10px}.forestwin{font-size:70px;animation:pop .5s ease}@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}@media(max-width:600px){.forest{min-height:340px}.bush{min-width:65px;min-height:65px}} </style></head><body>
<header><h1>🛡️ GSG 9 – Spezialretter</h1><button class="small" id="sound">🔊 Ton an</button></header>
<main class="wrap"><div class="status"><div class="pill" id="score">⭐ 0 Sterne</div><div class="pill" id="done">🏅 0 Einsätze</div><button class="small" id="repeat">🔊 Vorlesen</button></div>
<section id="home"><h2>🚨 Wähle deinen Einsatz!</h2><div class="grid" id="missions"></div><p class="foot">Ein fantasievolles, gewaltfreies Kinderspiel. Manche Rettungsaufgaben werden in Wirklichkeit von anderen Einsatzkräften übernommen.</p></section>
<section id="game" class="hidden"><button class="back" id="back">🏠 Zentrale</button><div class="stage"><div class="scene" id="scene"></div><div class="instruction" id="instruction"></div><div class="choices" id="choices"></div><div class="message" id="message" aria-live="polite"></div></div></section></main>
<script>
const missions=[
{icon:"🚁",title:"Hubschrauber",steps:[["Ein Wanderer braucht Hilfe. Wähle den Hubschrauber!","🚁",["🚁","🚜","🚂"]],["Was hilft beim Suchen aus der Luft?","🔭",["🧸","🔭","🎂"]],["Der Wanderer ist gefunden! Was bringen wir ihm?","💧",["🎸","💧","⚽"]]]},
{icon:"🐕",title:"Suchhund",steps:[["Ein Hund ist verschwunden. Wer hilft beim Suchen?","🐕",["🐟","🐕","🦋"]],["Wir suchen Spuren. Was nehmen wir mit?","🔦",["🔦","🍰","🎈"]],["Der Hund ist gefunden! Was bekommt er?","🥣",["🎮","🥣","🚲"]]]},
{icon:"🚤",title:"Inselrettung",steps:[["Auf der Insel wartet jemand. Womit fahren wir?","🚤",["🚂","🚤","🚜"]],["Sicherheit geht vor! Was ziehen wir an?","🦺",["👑","🦺","🎩"]],["Alle sind sicher. Wo fahren wir hin?","🏠",["🌋","🏠","🌙"]]]},
{icon:"🐈",title:"Katzenrettung",steps:[["Eine Katze sitzt hoch oben. Was brauchen wir?","🪜",["🪜","🎹","🛷"]],["Was sitzt auf dem Dach?","🐈",["🐘","🐈","🐙"]],["Die Katze ist unten. Was bekommt sie?","🥣",["🧱","🥣","📦"]]]},
{icon:"🚓",title:"Begleitfahrt",steps:[["Wir begleiten einen wichtigen Transport. Welches Fahrzeug passt?","🚓",["🚓","🚀","🚜"]],["Die Ampel zeigt Rot. Was machen wir?","🛑",["🏎️","🛑","🎉"]],["Wir sind angekommen. Was zeigen wir?","👍",["😡","👍","💤"]]]},
{icon:"🔦",title:"Nachtsuche",steps:[["Es ist dunkel. Was macht Licht?","🔦",["🍎","🔦","🧦"]],["Wir sehen Fußspuren. Was nehmen wir?","🔍",["🔍","🍕","🪁"]],["Der vermisste Hund ist da!","🐕",["🐕","🐍","🐬"]]]},
{icon:"🚉",title:"Am Bahnhof",steps:[["Ein Kind sucht seine Eltern. Wen fragen wir um Hilfe?","👮",["👮","🦖","🤖"]],["Wo warten wir gemeinsam sicher?","🪑",["🛤️","🪑","🌊"]],["Die Eltern kommen! Wie begrüßen wir sie?","👋",["👋","💣","😴"]]]},
{icon:"🧗",title:"Training",steps:[["Wir üben Klettern. Was schützt den Kopf?","⛑️",["🎩","⛑️","👒"]],["Wir üben Teamarbeit. Was machen wir?","🤝",["🤝","😠","🙈"]],["Training geschafft! Was trinken wir?","💧",["☕","💧","🧪"]]]},
{icon:"🚒",title:"Feuerwehrhilfe",steps:[["Die Feuerwehr braucht Unterstützung. Wer kommt?","🚒",["🚒","🚜","🚕"]],["Ein Weg ist gesperrt. Was stellen wir auf?","🚧",["🎁","🚧","🎻"]],["Alle sind sicher. Was machen wir?","👏",["👏","😢","💤"]]]},
{icon:"🐢",title:"Tierrettung",steps:[["Eine Schildkröte braucht Hilfe. Wo ist sie?","🐢",["🦒","🐢","🐝"]],["Womit bringen wir sie vorsichtig zur Station?","📦",["📦","⚽","🎺"]],["Wo darf sie sich erholen?","🌿",["🔥","🌿","🚦"]]]}
];
let state={stars:0,completed:[],sound:true};try{state={...state,...JSON.parse(localStorage.getItem("gsg9-save")||"{}")}}catch(e){}
let current=-1,step=0,locked=false,lastText="";const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("gsg9-save",JSON.stringify(state))}catch(e){}}
function speak(t){lastText=t;if(!state.sound||!window.speechSynthesis)return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}
function status(){$("score").textContent="⭐ "+state.stars+" Sterne";$("done").textContent="🏅 "+state.completed.length+" Einsätze";$("sound").textContent=state.sound?"🔊 Ton an":"🔇 Ton aus"}
function home(){current=-1;$("choices").classList.add("choices");$("game").classList.add("hidden");$("home").classList.remove("hidden");$("missions").innerHTML="";missions.forEach((m,i)=>{let b=document.createElement("button");b.className="mission";b.innerHTML='<span class="emoji">'+m.icon+'</span><span>'+m.title+(state.completed.includes(i)?" ⭐":"")+"</span>";b.onclick=()=>start(i);$("missions").appendChild(b)});status();speak("Willkommen bei den Spezialrettern! Such dir einen Einsatz aus.")}
function start(i){current=i;step=0;$("home").classList.add("hidden");$("game").classList.remove("hidden");render()}
function forestGame(){locked=false;let found=0;const spots=[{x:17,y:29,good:true,icon:"🐾"},{x:49,y:24,good:false,icon:"🦋"},{x:81,y:30,good:true,icon:"🦴"},{x:26,y:69,good:false,icon:"🐿️"},{x:57,y:64,good:true,icon:"🧣"},{x:86,y:76,good:false,icon:"🍄"}];$("scene").textContent="🌲🐕🌲";$("instruction").textContent="Finde drei Hinweise im Wald!";$("message").textContent="Tippe auf die Büsche und entdecke, was sich darunter versteckt.";$("choices").innerHTML="";$("choices").classList.remove("choices");const area=document.createElement("div");area.className="forest";area.setAttribute("aria-label","Wald mit sechs Büschen");$("choices").appendChild(area);const bar=document.createElement("div");bar.className="forestbar";bar.textContent="🔎 Hinweise: 0 von 3";$("choices").appendChild(bar);[[8,58],[70,55],[36,70],[92,72],[8,94],[72,96]].forEach(([x,y])=>{let t=document.createElement("span");t.className="tree";t.textContent="🌲";t.style.left=x+"%";t.style.top=y+"%";area.appendChild(t)});spots.forEach((s,i)=>{const b=document.createElement("button");b.className="bush";b.textContent="🌳";b.style.left=s.x+"%";b.style.top=s.y+"%";b.setAttribute("aria-label","Busch "+(i+1)+" untersuchen");b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.classList.add("found");b.textContent=s.icon;if(s.good){found++;bar.textContent="🔎 Hinweise: "+found+" von 3";speak(["","Eine Spur! Weiter suchen!","Noch ein Hinweis!","Alle Hinweise gefunden!"][found]);if(found===3){locked=true;setTimeout(()=>{area.innerHTML='<div class="forestwin" style="padding-top:90px">🐕💚🏡</div><div style="font-size:27px;color:#173824;font-weight:900">Hund gefunden!</div>';bar.textContent="🎉 Waldsuche geschafft!";$("instruction").textContent="Der Hund ist wieder sicher zu Hause!";$("message").textContent="⭐ ⭐ ⭐";state.stars+=3;if(!state.completed.includes(1))state.completed.push(1);save();status();speak("Hurra! Du hast den Hund gefunden! Drei Sterne für Jannik!");setTimeout(home,3500)},650)}}else{speak("Hier ist ein "+({ "🦋":"Schmetterling","🐿️":"Eichhörnchen","🍄":"Pilz"}[s.icon])+". Such weiter!")}};area.appendChild(b)});speak("Waldsuche! Ein Hund hat sich verlaufen. Tippe auf die Büsche und finde drei Hinweise!")}
function render(){if(current===1){forestGame();return}locked=false;const m=missions[current],s=m.steps[step];$("scene").textContent=m.icon+" "+s[1];$("instruction").textContent=s[0];$("message").textContent="";$("choices").innerHTML="";s[2].forEach(opt=>{let b=document.createElement("button");b.className="choice";b.textContent=opt;b.setAttribute("aria-label",opt);b.onclick=()=>choose(opt,b);$("choices").appendChild(b)});speak(m.title+". "+s[0])}
function choose(opt,b){if(locked)return;let s=missions[current].steps[step];if(opt!==s[1]){$("message").textContent="🔁 Versuch es noch einmal!";speak("Fast! Versuch es noch einmal.");return}locked=true;b.classList.add("good");$("message").textContent="🌟 Super gemacht!";speak("Super gemacht!");setTimeout(()=>{step++;if(step>=missions[current].steps.length){state.stars+=3;if(!state.completed.includes(current))state.completed.push(current);save();status();$("scene").textContent="🏆🎉⭐";$("instruction").textContent="Einsatz geschafft! Du bist ein tolles Teammitglied!";$("choices").innerHTML="";$("message").textContent="⭐ ⭐ ⭐";speak("Einsatz geschafft! Drei Sterne für dich!");setTimeout(home,2600)}else render()},1100)}
$("back").onclick=home;$("repeat").onclick=()=>speak(lastText);$("sound").onclick=()=>{state.sound=!state.sound;save();status();if(state.sound)speak(lastText)};status();home();
</script></body></html>
